document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 font-size: 15px; color: #3c352c;\">\n        <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid #efe8dc; padding-bottom: 12px;\"><span>Check-in<\u002Fspan><span style=\"color: #7a6f61;\">After 4:00 PM · smartlock self check-in<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid #efe8dc; padding-bottom: 12px;\"><span>Checkout<\u002Fspan><span style=\"color: #7a6f61;\">Before 11:00 AM<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid #efe8dc; padding-bottom: 12px;\"><span>Guests<\u002Fspan><span style=\"color: #7a6f61;\">6 maximum<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; border-bottom: 1px solid #efe8dc; padding-bottom: 12px;\"><span>Stairs<\u002Fspan><span style=\"color: #7a6f61;\">3 floors · bedrooms on the 3rd<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between;\"><span>Safety<\u002Fspan><span style=\"color: #7a6f61;\">Smoke + CO alarms · exterior cameras<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"book\" style=\"background: #2b2620;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 48px 96px;\">\n      <div style=\"text-align: center; margin-bottom: 44px;\">\n        <span style=\"font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #c9a87c;\">Book Direct<\u002Fspan>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(36px, 4.5vw, 52px); font-weight: 500; margin: 12px 0 10px; line-height: 1.1; color: #fdfbf7;\">Lexington awaits.<\u002Fh2>\n        <p style=\"font-size: 16px; color: rgba(253,251,247,0.7); margin: 0;\">Book directly with us — no platform fees. Select your dates below.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: start;\">\n        <div style=\"background: #fdfbf7; border-radius: 2px; padding: 28px 30px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;\">\n            <button sc-camel-on-click=\"{{ prevMonth }}\" style=\"background: none; border: 1px solid #e0d6c6; border-radius: 2px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: #2b2620;\">‹<\u002Fbutton>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: #2b2620;\">{{ monthLabel }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ nextMonth }}\" style=\"background: none; border: 1px solid #e0d6c6; border-radius: 2px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: #2b2620;\">›<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px;\">\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">SUN<\u002Fdiv>\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">MON<\u002Fdiv>\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">TUE<\u002Fdiv>\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">WED<\u002Fdiv>\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">THU<\u002Fdiv>\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">FRI<\u002Fdiv>\n            <div style=\"text-align: center; font-size: 10px; letter-spacing: 0.15em; color: #a3988a;\">SAT<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;\">\n            <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"35\">\n              <div style=\"{{ d.style }}\" sc-camel-on-click=\"{{ d.onClick }}\">\n                <div style=\"font-size: 14px; font-weight: 500;\">{{ d.label }}<\u002Fdiv>\n                <div style=\"font-size: 10px; opacity: 0.7;\">{{ d.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 18px; margin-top: 16px; font-size: 12px; color: #7a6f61;\">\n            <div style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 10px; height: 10px; background: #8a5a2b; border-radius: 2px; display: inline-block;\"><\u002Fspan>Selected<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 10px; height: 10px; background: #f0e9dd; border-radius: 2px; display: inline-block;\"><\u002Fspan>Unavailable<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #fdfbf7; border-radius: 2px; padding: 28px 30px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n            <div style=\"border: 1px solid #e0d6c6; border-radius: 2px; padding: 10px 14px;\"><div style=\"font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #a3988a;\">Check-in<\u002Fdiv><div style=\"font-size: 14px; font-weight: 500; color: #2b2620;\">{{ checkInLabel }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"border: 1px solid #e0d6c6; border-radius: 2px; padding: 10px 14px;\"><div style=\"font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #a3988a;\">Checkout<\u002Fdiv><div style=\"font-size: 14px; font-weight: 500; color: #2b2620;\">{{ checkOutLabel }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0d6c6; border-radius: 2px; padding: 10px 14px;\">\n            <div><div style=\"font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #a3988a;\">Guests<\u002Fdiv><div style=\"font-size: 14px; font-weight: 500; color: #2b2620;\">{{ guests }} guests · 6 max<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: flex; gap: 8px;\">\n              <button sc-camel-on-click=\"{{ fewerGuests }}\" style=\"width: 30px; height: 30px; border: 1px solid #e0d6c6; background: none; border-radius: 2px; cursor: pointer; color: #2b2620;\">−<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ moreGuests }}\" style=\"width: 30px; height: 30px; border: 1px solid #e0d6c6; background: none; border-radius: 2px; cursor: pointer; color: #2b2620;\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasQuote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #efe8dc; padding-top: 14px; font-size: 14px; color: #3c352c;\">\n              <div style=\"display: flex; justify-content: space-between;\"><span>{{ nightsLabel }}<\u002Fspan><span>{{ lodgingStr }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between;\"><span>Cleaning fee<\u002Fspan><span>{{ cleaningStr }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between;\"><span>Taxes<\u002Fspan><span>{{ taxStr }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; border-top: 1px solid #efe8dc; padding-top: 10px; color: #2b2620;\"><span>Total<\u002Fspan><span>{{ totalStr }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noQuote }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size: 13px; color: #a3988a; text-align: center; padding: 8px 0;\">Select a check-in and checkout date to see your total.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #efe8dc; padding-top: 14px;\">\n            <input value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Your name\" style=\"border: 1px solid #e0d6c6; border-radius: 2px; padding: 11px 14px; font-size: 14px; font-family: 'Figtree', sans-serif; background: #fdfbf7; color: #2b2620;\">\n            <input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"Email\" type=\"email\" style=\"border: 1px solid #e0d6c6; border-radius: 2px; padding: 11px 14px; font-size: 14px; font-family: 'Figtree', sans-serif; background: #fdfbf7; color: #2b2620;\">\n            <input value=\"{{ phone }}\" sc-camel-on-change=\"{{ setPhone }}\" placeholder=\"Phone (optional)\" style=\"border: 1px solid #e0d6c6; border-radius: 2px; padding: 11px 14px; font-size: 14px; font-family: 'Figtree', sans-serif; background: #fdfbf7; color: #2b2620;\">\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ submitRequest }}\" style=\"{{ requestBtnStyle }}\">Request to Book<\u002Fbutton>\n          <sc-if value=\"{{ showFallback }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border: 1px solid #e0d6c6; border-radius: 2px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"font-size: 13px; color: #3c352c; line-height: 1.5;\">If your email app didn't open, copy your request and send it to <strong>{{ hostEmail }}<\u002Fstrong>:<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ copyRequest }}\" style=\"border: 1px solid #2b2620; background: none; border-radius: 2px; padding: 10px 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; cursor: pointer; color: #2b2620; font-family: 'Figtree', sans-serif;\">{{ copyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font-size: 12px; color: #a3988a; text-align: center; line-height: 1.5;\">Your request goes straight to your hosts — we confirm availability and payment details within the hour. No booking fees.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width: 1200px; margin: 0 auto; padding: 36px 48px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;\">\n    <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600;\">The Starting Gate<\u002Fspan>\n    <span style=\"font-size: 13px; color: #7a6f61;\">Lexington, Kentucky · © 2026 · Boutique comfort in the Distillery District<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showReview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = (() => {\n    const t = new Date();\n    return { y: t.getFullYear(), m: t.getMonth(), checkIn: null, checkOut: null, guests: 2, name: \"\", email: \"\", phone: \"\" };\n  })();\n  componentDidMount() {\n    if (!window.SG_RATES) { const iv = setInterval(() => { if (window.SG_RATES) { clearInterval(iv); this.forceUpdate(); } }, 100); }\n  }\n  cfg() {\n    return window.SG_RATES || { currency: \"USD\", default: 189, ranges: [], cleaningFee: 95, taxRate: 0.06, minNights: 2, maxGuests: 6, blocked: [], requestEmail: \"\" };\n  }\n  fmt(n) { return \"$\" + Math.round(n).toLocaleString(\"en-US\"); }\n  iso(y, m, d) { return `${y}-${String(m + 1).padStart(2, \"0\")}-${String(d).padStart(2, \"0\")}`; }\n  inSpan(dateStr, span) { return dateStr >= span.start && dateStr <= span.end; }\n  rateFor(dateStr) {\n    const c = this.cfg();\n    if (c.rateFor) return c.rateFor(dateStr);\n    for (const r of c.ranges || []) { if (this.inSpan(dateStr, r)) return r.rate; }\n    return c.default;\n  }\n  minNightsFor(dateStr) {\n    const c = this.cfg();\n    return c.minNightsFor ? c.minNightsFor(dateStr) : (c.minNights || 1);\n  }\n  isBlocked(dateStr) { return (this.cfg().blocked || []).some(b => this.inSpan(dateStr, b)); }\n  nightsBetween(a, b) {\n    const out = [];\n    let d = new Date(a + \"T00:00:00\");\n    const end = new Date(b + \"T00:00:00\");\n    while (d < end) { out.push(this.iso(d.getFullYear(), d.getMonth(), d.getDate())); d.setDate(d.getDate() + 1); }\n    return out;\n  }\n  pickDay(dateStr) {\n    const { checkIn, checkOut } = this.state;\n    if (!checkIn || (checkIn && checkOut)) { this.setState({ checkIn: dateStr, checkOut: null }); return; }\n    if (dateStr <= checkIn) { this.setState({ checkIn: dateStr, checkOut: null }); return; }\n    const nights = this.nightsBetween(checkIn, dateStr);\n    if (nights.some(n => this.isBlocked(n))) { this.setState({ checkIn: dateStr, checkOut: null }); return; }\n    if (nights.length < this.minNightsFor(checkIn)) { this.setState({ checkIn: dateStr, checkOut: null }); return; }\n    this.setState({ checkOut: dateStr });\n  }\n  renderVals() {\n    const c = this.cfg();\n    const { y, m, checkIn, checkOut, guests, name, email, phone } = this.state;\n    const todayD = new Date();\n    const today = this.iso(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());\n    const first = new Date(y, m, 1);\n    const daysInMonth = new Date(y, m + 1, 0).getDate();\n    const days = [];\n    for (let i = 0; i < first.getDay(); i++) days.push({ label: \"\", sub: \"\", style: {}, onClick: null });\n    for (let d = 1; d <= daysInMonth; d++) {\n      const ds = this.iso(y, m, d);\n      const past = ds < today, blocked = this.isBlocked(ds);\n      const isStart = ds === checkIn, isEnd = ds === checkOut;\n      const inRange = checkIn && checkOut && ds > checkIn && ds < checkOut;\n      const base = { textAlign: \"center\", padding: \"8px 2px 6px\", borderRadius: \"2px\", cursor: past || blocked ? \"default\" : \"pointer\", userSelect: \"none\", color: \"#2b2620\", background: \"transparent\", border: \"1px solid transparent\" };\n      if (past) { base.color = \"#cfc6b8\"; }\n      else if (blocked) { base.background = \"#f0e9dd\"; base.color = \"#b3a99a\"; base.textDecoration = \"line-through\"; }\n      else if (isStart || isEnd) { base.background = \"#8a5a2b\"; base.color = \"#fdfbf7\"; }\n      else if (inRange) { base.background = \"#e9d9be\"; }\n      else { base.border = \"1px solid #efe8dc\"; }\n      days.push({ label: String(d), sub: past || blocked ? \" \" : this.fmt(this.rateFor(ds)), style: base, onClick: past || blocked ? null : () => this.pickDay(ds) });\n    }\n    let quote = null;\n    if (checkIn && checkOut) {\n      const nights = this.nightsBetween(checkIn, checkOut);\n      const lodging = nights.reduce((s, n) => s + this.rateFor(n), 0);\n      const tax = (lodging + c.cleaningFee) * (c.taxRate || 0);\n      quote = { nights: nights.length, lodging, cleaning: c.cleaningFee, tax, total: lodging + c.cleaningFee + tax };\n    }\n    const fmtDate = ds => ds ? new Date(ds + \"T00:00:00\").toLocaleDateString(\"en-US\", { month: \"short\", day: \"numeric\", year: \"numeric\" }) : \"Add date\";\n    const ready = quote && name.trim() && email.trim();\n    const body = quote ? encodeURIComponent(\n      `Booking request — The Starting Gate\\n\\nCheck-in: ${fmtDate(checkIn)}\\nCheckout: ${fmtDate(checkOut)}\\nGuests: ${guests}\\n\\nLodging (${quote.nights} nights): ${this.fmt(quote.lodging)}\\nCleaning fee: ${this.fmt(quote.cleaning)}\\nTaxes: ${this.fmt(quote.tax)}\\nTotal: ${this.fmt(quote.total)}\\n\\nName: ${name}\\nEmail: ${email}\\nPhone: ${phone}`) : \"\";\n    return {\n      showReview: this.props.showReview ?? true,\n      monthLabel: first.toLocaleDateString(\"en-US\", { month: \"long\", year: \"numeric\" }),\n      prevMonth: () => this.setState({ y: m === 0 ? y - 1 : y, m: m === 0 ? 11 : m - 1 }),\n      nextMonth: () => this.setState({ y: m === 11 ? y + 1 : y, m: m === 11 ? 0 : m + 1 }),\n      days,\n      checkInLabel: fmtDate(checkIn), checkOutLabel: fmtDate(checkOut),\n      guests,\n      fewerGuests: () => this.setState(s => ({ guests: Math.max(1, s.guests - 1) })),\n      moreGuests: () => this.setState(s => ({ guests: Math.min(c.maxGuests || 6, s.guests + 1) })),\n      hasQuote: !!quote, noQuote: !quote,\n      nightsLabel: quote ? `${quote.nights} night${quote.nights > 1 ? \"s\" : \"\"}` : \"\",\n      lodgingStr: quote ? this.fmt(quote.lodging) : \"\",\n      cleaningStr: quote ? this.fmt(quote.cleaning) : \"\",\n      taxStr: quote ? this.fmt(quote.tax) : \"\",\n      totalStr: quote ? this.fmt(quote.total) : \"\",\n      name, email, phone,\n      setName: e => this.setState({ name: e.target.value }),\n      setEmail: e => this.setState({ email: e.target.value }),\n      setPhone: e => this.setState({ phone: e.target.value }),\n      submitRequest: () => {\n        if (!ready) return;\n        const href = `mailto:${c.requestEmail}?subject=${encodeURIComponent(\"Booking request — The Starting Gate\")}&body=${body}`;\n        this.setState({ showFallback: true, copied: false });\n        try { window.open(href, \"_self\"); } catch (err) {}\n      },\n      showFallback: !!this.state.showFallback,\n      hostEmail: c.requestEmail,\n      copyLabel: this.state.copied ? \"Copied ✓\" : \"Copy request details\",\n      copyRequest: () => {\n        navigator.clipboard.writeText(decodeURIComponent(body)).then(() => this.setState({ copied: true }));\n      },\n      requestBtnStyle: {\n        display: \"block\", width: \"100%\", textAlign: \"center\", padding: \"15px 0\", borderRadius: \"2px\",\n        fontSize: \"13px\", letterSpacing: \"0.14em\", textTransform: \"uppercase\", fontWeight: 600,\n        fontFamily: \"'Figtree', sans-serif\", border: \"none\",\n        background: ready ? \"#2b2620\" : \"#d9d0c2\", color: ready ? \"#fdfbf7\" : \"#a3988a\",\n        cursor: ready ? \"pointer\" : \"default\", pointerEvents: ready ? \"auto\" : \"none\",\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
